name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TubeGrab-APKs
          path: app/build/outputs/apk/release/*.apk

      # Publish the APKs as a GitHub Release so they can be downloaded directly on a phone
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TubeGrab build ${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/release/*.apk
