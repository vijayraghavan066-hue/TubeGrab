name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build APKs
        env:
          TG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TG_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TG_KEY_ALIAS: tubegrab
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f app/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: TubeGrab-APKs
          path: app/build/outputs/apk/release/*.apk

      # Publish the APKs to the PUBLIC APK-only repo, which the in-app updater reads.
      # RELEASES_TOKEN = a fine-grained token with Contents: read & write on TubeGrab-releases.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          repository: vijayraghavan066-hue/TubeGrab-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: build-${{ github.run_number }}
          name: TubeGrab build ${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/release/*.apk
